[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aldhakira"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Private local second brain with BM25 retrieval."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
aldhakira = "aldhakira.cli:main"

[tool.setuptools]
packages = ["aldhakira"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
